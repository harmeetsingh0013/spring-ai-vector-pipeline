spring.application.name=sprint-ai-vector-pipeline

server.port=0

spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.collection-name=GameRules

spring.ai.openai.api-key=${SPRING_OPENAI_KEY}

spring.cloud.function.definition=\
  fileSupplier|\
  documentReader|\
  splitter|\
  titleDeterminer|\
  vectorStoreConsumer

file.supplier.directory=/tmp/spring-ai
file.supplier.filename-regex=.*\\.(pdf|docx|txt)

reactor.schedulers.defaultBoundedElasticOnVirtualThreads=true